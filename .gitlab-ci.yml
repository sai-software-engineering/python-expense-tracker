stages:
  - build
  - deploy

build-documentation:
  stage: build
  image: ruby:3.3

  before_script:
    - bundle install

  script:
    - bundle exec jekyll build --config _config.yml

  artifacts:
    paths:
      - public/
    expire_in: 1 week

  rules:
    - if: '$CI_COMMIT_BRANCH'

deploy-documentation:
  stage: deploy

  needs:
    - job: build-documentation
      artifacts: true

  script:
    - echo "Publishing Jekyll documentation to GitLab Pages."

  pages:
    publish: public

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

  environment:
    name: production
    url: $CI_PAGES_URL