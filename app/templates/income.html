
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Income | Expense Tracker</title>

    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="logo">Expense Tracker</div>

        <nav>
            <a href="/">Home</a>
            <a href="/expenses">Expense</a>
            <a href="/income" class="active">Income</a>
            <a href="/categories">Categories</a>
        </nav>
    </header>


    <main class="container">

        <!-- Welcome Section -->
        <section class="welcome-section">
            <h1>Income Management</h1>
            <p>Track and manage your income sources.</p>
        </section>


        <!-- Add Income Form -->
        <section class="chart-section">

            <h2 id="income-form-title">Add New Income</h2>

            <form id="income-form">

                <input type="hidden" id="income-id">

                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input
                        type="number"
                        id="amount"
                        step="0.01"
                        min="0.01"
                        placeholder="Enter amount"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <input
                        type="text"
                        id="description"
                        maxlength="255"
                        placeholder="Enter description"
                    >
                </div>

                <div class="form-group">
                    <label for="transaction-date">Transaction Date</label>
                    <input
                        type="date"
                        id="transaction-date"
                        required
                    >
                </div>

                <div class="form-actions">

                    <button type="submit" class="btn btn-primary">
                        Save Income
                    </button>

                    <button
                        type="button"
                        id="cancel-edit"
                        class="btn btn-secondary"
                        hidden
                    >
                        Cancel
                    </button>

                </div>

            </form>

            <p id="income-message"></p>

        </section>


        <!-- Income History -->
        <section class="chart-section">

            <h2>Income History</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="income-table-body">
                        <tr>
                            <td colspan="6">Loading income records...</td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">
        <p>Expense Tracker | Manage your money wisely.</p>
    </footer>


    <script src="../static/js/income.js"></script>

</body>
</html>
