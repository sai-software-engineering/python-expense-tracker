<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% if page.title %}
            {{ page.title }} | {{ site.title }}
        {% else %}
            {{ site.title }}
        {% endif %}
    </title>

    <meta name="description" content="{{ site.description }}">

    <link rel="stylesheet"
          href="{{ '/assets/css/style.css' | relative_url }}">

    <script src="https://cdn.jsdelivr.net/npm/mermaid@12.3.0/dist/mermaid.min.js"></script>
</head>



<body>

<header class="page-header">
    <h1 class="project-name">{{ site.title }}</h1>
    <h2 class="project-tagline">{{ site.description }}</h2>
</header>

<main class="main-content">
    {{ content }}
</main>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll("pre code.language-mermaid")
            .forEach(function (block) {
                const diagram = document.createElement("div");
                diagram.className = "mermaid";
                diagram.textContent = block.textContent;
                block.parentElement.replaceWith(diagram);
            });

        mermaid.initialize({
            startOnLoad: true,
            theme: "default",
            securityLevel: "strict"
        });
    });
</script>

</body>
</html>
